[package]
name = "serwus-test"
version = { workspace = true }
authors = { workspace = true }
description = "Helpers for end-to-end tests of serwus services - Postgres in a container and the service as a process"
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false }
testcontainers-modules = { version = "0.15", features = ["postgres", "watchdog"] }
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
tokio-postgres = "0.7"
